<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Piece of Days — dev</title>
  <style>
    :root {
      color-scheme: dark;
      --ds-bg: #08090c;
      --ds-surface: #101218;
      --ds-foreground: #e6e4df;
      --ds-muted-foreground: #8b93a8;
      --ds-border: #1e2232;
      --ds-warning: #f4a261;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--ds-bg);
      color: var(--ds-foreground);
      font-family: "Pretendard", "Noto Sans KR", -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Roboto, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    main { max-width: 560px; text-align: center; }
    .badge {
      display: inline-block;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 12px;
      letter-spacing: 0.18em;
      color: var(--ds-warning);
      border: 1px solid var(--ds-border);
      background: var(--ds-surface);
      border-radius: 4px;
      padding: 6px 12px;
      margin-bottom: 28px;
    }
    h1 { font-size: 48px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 16px; }
    p { font-size: 15px; line-height: 1.7; color: var(--ds-muted-foreground); word-break: keep-all; }
    .design-link {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 52px; margin-top: 32px; padding: 0 28px;
      background: var(--ds-foreground); color: var(--ds-bg);
      border-radius: 6px; font-size: 18px; font-weight: 700; text-decoration: none;
    }
    .design-link:hover { background: #ffffff; }
    .design-link:focus-visible { outline: 3px solid var(--ds-warning); outline-offset: 3px; }
    .design-note { margin-top: 12px; font-size: 14px; }
    code {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 13px;
      color: var(--ds-foreground);
    }
  </style>
</head>
<body>
  <main>
    <p class="badge">DEV ENVIRONMENT</p>
    <h1>Piece of Days</h1>
    <p>dev.pieceofdays.com 개발 환경이 연결되었습니다.<br>
    <code>dev</code> 브랜치에 push 하면 GitHub Actions 검사 후 자동배포됩니다.<br>
    실제 앱 개발이 시작되면 이 플레이스홀더는 교체됩니다.</p>
    <a class="design-link" href="/design/d-warm-pieces/">선택한 D 화면 보기</a>
    <p class="design-note">조각 수정·기록 글꼴을 미리 써 보세요. 예시 기록이며 저장되지 않습니다.</p>
    <p class="design-note"><a href="/design/">4안 비교</a> · <a href="/promo/">20초 세로 홍보영상</a></p>
  </main>
</body>
</html>
