# 역할을 나눈 TDD 설정(tdd-cycle 스킬 · tdd_gate.sh · tdd-runner가 읽는다) — 셸 문법, 비밀값 금지
# 원본 절차: ~/projects/_template/claude/README.md

# 시험 파일(RED는 여기만 바꾸고, GREEN은 여기를 건드리지 않는다).
# .claude/tdd.conf 자신도 포함한다 — RED 관문이 이 파일을 시험 밖 변경으로 막지 않고,
# GREEN이 시험 설정을 바꾸는 것도 막기 위해서다.
TEST_PATTERNS="tests/* .claude/tdd.conf app/tests/* app/vitest*.ts app/playwright*.ts"

# 대상 시험 명령 — 표준 라이브러리 unittest만 쓴다(외부 패키지·네트워크·Docker 없음).
# runner가 뒤에 시험 이름을 붙여 쓸 수 있다: + tests.test_deploy.ParseRequestTests
DEPLOY_TEST='python3 -B -m unittest -v tests.test_deploy'

# 앱 시험. 파일 선택 인자는 명령 뒤에 붙인다(예: tests/unit/fonts.test.ts).
APP_UNIT_TEST='npm --prefix app test --'
APP_DB_TEST='npm --prefix app run test:db --'
# 서버를 띄우는 시험은 격리된 Cloud/CI/개발 PC에서만 실행한다.
APP_E2E_TEST='test "${POD_FULL_CHECK_ISOLATED:-}" = 1 && npm --prefix app run test:e2e --'
APP_PROD_TEST='test "${POD_FULL_CHECK_ISOLATED:-}" = 1 && npm --prefix app run test:prod-smoke --'

# 전체 검사: 일회용 DB 환경부터 검증한 뒤 배포·앱 검사를 순차 실행한다.
# 공유 운영 서버에서 FULL_CHECK·앱 서버 시험을 실행하지 않는다.
FULL_CHECK='bash app/tests/full-check.sh'
REQUIRES='Isolated Cloud/CI/dev PC; Node 24.22.2+ or 26.13.0+ within those major lines; app npm ci; Playwright Chromium; disposable PostgreSQL 18; POD_FULL_CHECK_ISOLATED=1; POD_TEST_DB_DISPOSABLE=1; POD_TEST_ADMIN_URL'
