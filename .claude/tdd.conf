# 역할을 나눈 TDD 설정(tdd-cycle 스킬 · tdd_gate.sh · tdd-runner가 읽는다) — 셸 문법, 비밀값 금지
# 원본 절차: ~/projects/_template/claude/README.md

# 시험 파일(RED는 여기만 바꾸고, GREEN은 여기를 건드리지 않는다).
# .claude/tdd.conf 자신도 포함한다 — RED 관문이 이 파일을 시험 밖 변경으로 막지 않고,
# GREEN이 시험 설정을 바꾸는 것도 막기 위해서다.
TEST_PATTERNS="tests/* .claude/tdd.conf"

# 대상 시험 명령 — 표준 라이브러리 unittest만 쓴다(외부 패키지·네트워크·Docker 없음).
# runner가 뒤에 시험 이름을 붙여 쓸 수 있다: + tests.test_deploy.ParseRequestTests
DEPLOY_TEST='python3 -B -m unittest -v tests.test_deploy'

# 전체 검사(현재는 배포 스크립트 시험이 전부)
FULL_CHECK='python3 -B -m unittest discover -s tests -p "test_*.py" -v'

# 시험에 필요한 것: 없음(JSON/dict 입력만, 실제 compose·Docker·SSH 호출 없음)
