# Public-safe fragment extracted from the prepared private proposal on 2026-11-08.
# The log format belongs in http; the locations belong in the existing dev server.
log_format pieceofdays_callback_safe escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr","x_forwarded_for":"$http_x_forwarded_for","host":"$host","server_name":"$server_name","request_method":"$request_method","request_uri":"$uri","uri":"$uri","args":"","status":$status,"body_bytes_sent":$body_bytes_sent,"http_referer":"","http_user_agent":"$http_user_agent","request_time":"$request_time","upstream_response_time":"$upstream_response_time","scheme":"$scheme"}';

location = /auth/google/callback {
    access_log /var/log/nginx/access.log pieceofdays_callback_safe;
    error_log /dev/null crit;
    proxy_hide_header Referrer-Policy;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    proxy_pass $pieceofdays_dev_web;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
}

location = /auth/kakao/callback {
    access_log /var/log/nginx/access.log pieceofdays_callback_safe;
    error_log /dev/null crit;
    proxy_hide_header Referrer-Policy;
