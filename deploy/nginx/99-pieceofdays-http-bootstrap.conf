# pieceofdays.com / pieceofdays.co.kr 인증서 발급 전 부트스트랩 (HTTP + ACME 만).
# certbot 발급(2장: pieceofdays.com, pieceofdays.co.kr) 성공 후 99-pieceofdays.conf 로 교체한다.
server {
    listen 80;
    server_name pieceofdays.com www.pieceofdays.com pieceofdays.co.kr www.pieceofdays.co.kr;
    access_log /var/log/nginx/access.log ops_json;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://pieceofdays.com$request_uri;
    }
}
