# --- pieceofdays.com / pieceofdays.co.kr -> Piece of Days 준비중 페이지 ---
# 설치 위치: /opt/infra/nginx/conf/services-enabled/99-pieceofdays.conf
# 도메인 정책: pieceofdays.com 이 canonical.
#   - http://{com,www.com,co.kr,www.co.kr} -> 301 https://pieceofdays.com
#   - https://www.pieceofdays.com          -> 301 https://pieceofdays.com
#   - https://{pieceofdays.co.kr,www.pieceofdays.co.kr} -> 301 https://pieceofdays.com
# 인증서: pieceofdays.com (com+www) / pieceofdays.co.kr (co.kr+www) 2장 — 갱신 독립.

# HTTP: ACME + canonical https 리다이렉트 (4개 호스트 공통)
server {
    listen 80;
    server_name pieceofdays.com www.pieceofdays.com pieceofdays.co.kr www.pieceofdays.co.kr;
    access_log /var/log/nginx/access.log ops_json;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://pieceofdays.com$request_uri;
    }
}

# HTTPS canonical: pieceofdays.com -> 준비중 페이지
server {
    listen 443 ssl;
    server_name pieceofdays.com;
    access_log /var/log/nginx/access.log ops_json;

    ssl_certificate     /etc/letsencrypt/live/pieceofdays.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pieceofdays.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    resolver 127.0.0.11 ipv6=off valid=30s;
    set $pieceofdays_comingsoon http://pieceofdays-comingsoon:80;

    location / {
        proxy_pass $pieceofdays_comingsoon;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }
}

# HTTPS: www.pieceofdays.com -> canonical 301
server {
    listen 443 ssl;
    server_name www.pieceofdays.com;
    access_log /var/log/nginx/access.log ops_json;

    ssl_certificate     /etc/letsencrypt/live/pieceofdays.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pieceofdays.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    return 301 https://pieceofdays.com$request_uri;
}

# HTTPS: pieceofdays.co.kr (+www) -> canonical 301
server {
    listen 443 ssl;
    server_name pieceofdays.co.kr www.pieceofdays.co.kr;
    access_log /var/log/nginx/access.log ops_json;

    ssl_certificate     /etc/letsencrypt/live/pieceofdays.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pieceofdays.co.kr/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    return 301 https://pieceofdays.com$request_uri;
}
