# --- dev.pieceofdays.com -> Piece of Days Dev (HTTP redirect + ACME) ---
# 설치 위치: /opt/infra/nginx/conf/services-enabled/99-pieceofdays-dev.conf
# 전제: dev.pieceofdays.com A 레코드 + certbot 인증서 발급 완료
server {
    listen 80;
    server_name dev.pieceofdays.com;
    access_log /var/log/nginx/access.log ops_json;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- dev.pieceofdays.com -> Piece of Days Dev (HTTPS) ---
server {
    listen 443 ssl;
    server_name dev.pieceofdays.com;
    access_log /var/log/nginx/access.log ops_json;

    ssl_certificate     /etc/letsencrypt/live/dev.pieceofdays.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.pieceofdays.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # 접근 제한: 본인 IP는 통과, 그 외에는 basic auth 요구
    # 192.168.0.0/16: 서버와 같은 LAN에서의 접속은 헤어핀 NAT로 192.168.0.1로 보임
    satisfy any;
    allow 121.178.235.235;
    allow 192.168.0.0/16;
    deny all;
    auth_basic "pieceofdays dev";
    auth_basic_user_file /etc/nginx/conf.d/auth/dev.htpasswd;

    # 검색엔진 색인 금지
    add_header X-Robots-Tag "noindex, nofollow" always;

    resolver 127.0.0.11 ipv6=off valid=30s;
    set $pieceofdays_dev_web http://pieceofdays-frontend-dev:80;

    location / {
        proxy_pass $pieceofdays_dev_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
