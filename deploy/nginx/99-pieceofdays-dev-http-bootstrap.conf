# dev.pieceofdays.com 인증서 발급 전 부트스트랩 (HTTP + ACME 만).
# DNS A 레코드 등록 -> certbot 발급 성공 후 99-pieceofdays-dev.conf 로 교체한다.
server {
    listen 80;
    server_name dev.pieceofdays.com;
    access_log /var/log/nginx/access.log ops_json;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
