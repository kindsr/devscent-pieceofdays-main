# 운영 pieceofdays.com HTTPS server 안에 include하는 검토용 조각(PLAN_production-app-deployment §4).
# 독립 server/http 설정이 아니며 저장소 push만으로 설치되지 않는다. 실제 반영은 main이 nginx -t 후 reload한다.
# 전제: 상위(http) 수준 proxy_hide_header 5개, server의 $pieceofdays_comingsoon·$pieceofdays_photos_relay 변수.
# server 수준 보안 헤더 5개를 여기서 한 번 선언한다. callback 두 곳만 Referrer-Policy no-referrer로 5개를 다시 선언하고,
# 나머지 location은 add_header·proxy_hide_header를 두지 않아 server 값과 상위 hide를 그대로 상속한다(각 헤더 한 값).
add_header X-Robots-Tag "noindex, nofollow" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;

# OIDC callback: code·state·referrer를 기록하지 않는다.
location = /auth/google/callback {
    access_log off;
    error_log /dev/null crit;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    proxy_pass $pieceofdays_comingsoon;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_connect_timeout 10s;
}

location = /auth/kakao/callback {
    access_log off;
    error_log /dev/null crit;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    proxy_pass $pieceofdays_comingsoon;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_connect_timeout 10s;
}

# 앱 사진 경로: 업로드 9m, 읽기 1m, 로그 없음.
location = /photos/upload {
    client_max_body_size 9m;
    access_log off;
    error_log /dev/null crit;
    proxy_pass $pieceofdays_comingsoon;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
}

location ^~ /photos/ {
    client_max_body_size 1m;
    access_log off;
    error_log /dev/null crit;
    proxy_pass $pieceofdays_comingsoon;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
}

# 서명된 S3 요청 relay: 원래 Host·request URI·본문을 바꾸지 않고 front 8081로 넘긴다.
# 변수 proxy_pass(URI 없음)라 client가 보낸 request URI 그대로 전달되고, front 8081이 원문 정규식으로 다시 판정한다.
location ^~ /pieceofdays-photos/ {
    client_max_body_size 5m;
    access_log off;
    error_log /dev/null crit;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_set_header Host $http_host;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
    proxy_pass $pieceofdays_photos_relay;
}
