<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Piece of Days — 서비스 준비중</title>
  <style>
    /* DevScent 디자인 가이드 v2 토큰 (docs/02_DESIGN_GUIDE_v2.md) */
    :root {
      color-scheme: dark;
      --ds-bg: #08090c;
      --ds-surface: #101218;
      --ds-foreground: #e6e4df;
      --ds-muted-foreground: #8b93a8;
      --ds-border: #1e2232;
      --ds-accent: #34d399;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--ds-bg);
      color: var(--ds-foreground);
      font-family: "Pretendard", "Noto Sans KR", -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Roboto, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 560px; text-align: center; }
    .eyebrow {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 12px;
      letter-spacing: 0.22em;
      color: var(--ds-muted-foreground);
      text-transform: uppercase;
      margin-bottom: 28px;
    }
    h1 {
      font-size: clamp(40px, 10vw, 64px);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin-bottom: 20px;
    }
    .tagline {
      font-size: clamp(15px, 4vw, 17px);
      line-height: 1.7;
      color: var(--ds-muted-foreground);
      word-break: keep-all;
      margin-bottom: 40px;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--ds-surface);
      border: 1px solid var(--ds-border);
      border-radius: 999px;
      padding: 10px 20px;
      font-size: 14px;
      color: var(--ds-foreground);
    }
    .status .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ds-accent);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    footer {
      margin-top: 64px;
      font-size: 12px;
      color: var(--ds-muted-foreground);
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">pieceofdays.com</p>
    <h1>Piece of Days</h1>
    <p class="tagline">하루하루의 소중한 조각을 모아 기록하는 서비스.<br>
    좋은 모습으로 찾아뵙기 위해 준비하고 있습니다.</p>
    <p class="status"><span class="dot"></span>서비스 준비중</p>
    <footer>&copy; DevScent</footer>
  </main>
</body>
</html>
