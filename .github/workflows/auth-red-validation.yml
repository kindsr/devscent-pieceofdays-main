name: Verify B4 RED auth harness on PG18 (temporary)

on:
  push:
    branches: [verify/b4-red-pg18]

permissions:
  contents: read

jobs:
  auth-red:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:18.6@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      POD_FULL_CHECK_ISOLATED: "1"
      POD_TEST_DB_DISPOSABLE: "1"
      POD_TEST_ADMIN_URL: postgres://postgres:ci-only-not-a-secret@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "26.13.0"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install pinned dependencies
        run: npm ci
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify two expected RED cases after real PG18 setup
        run: npx playwright test -c playwright.auth.config.ts --grep 'D login screen|google. success' --max-failures=2
